[project]
name = "orange-pi-server"
version = "0.1.0"
description = ""
authors = [
    {name = "paranoik1",email = "paranoik@noreplay.com"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "pyserial (>=3.5,<4.0)",
    "zstandard (>=0.25.0,<0.26.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "trafilatura (>=2.3.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "mypy (>=2.4.0,<3.0.0)",
    "types-pyserial (>=3.5.0.20260712,<4.0.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]
