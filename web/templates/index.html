
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111111;
            color: #eeeeee;
            font-family: system-ui, sans-serif;
        }

        .login {
            width: 100%;
            max-width: 360px;
            padding: 24px;
        }

        h1 {
            margin: 0 0 28px;
            font-size: 22px;
            font-weight: 500;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #333333;
            border-radius: 6px;
            outline: none;
            background: #1a1a1a;
            color: #eeeeee;
            font: inherit;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #777777;
        }

        input::placeholder {
            color: #666666;
        }

        button {
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #eeeeee;
            color: #111111;
            font: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        .error {
            color: #e57373;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>

<body>
    <main class="login">
        <h1>Вход</h1>

        <form method="POST" action="/">
            <input
                type="password"
                name="master_key"
                placeholder="Master key"
                autocomplete="current-password"
                required
                autofocus
            >

            {% if error %}
                <p class="error" id="error">
                    {{ error }}
                </p>
            {% endif %}

            <button type="submit">Войти</button>
        </form>
    </main>
</body>
</html>
